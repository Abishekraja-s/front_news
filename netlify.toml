[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  VITE_API_URL = "https://news-backend-pxp9-a6j6.onrender.com"
  VITE_SITE_URL = "https://thegreatindianews.netlify.app"
  NODE_VERSION = "20"

# Dedicated share page for WhatsApp / Facebook image previews
[[redirects]]
  from = "/og/news/:slug"
  to = "/.netlify/functions/og-article?slug=:slug"
  status = 200
  force = true

# Edge: when bots open normal /news/* links, still inject OG + image
[[edge_functions]]
  function = "article-og"
  path = "/news/*"

# SPA fallback (after /og and edge)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
